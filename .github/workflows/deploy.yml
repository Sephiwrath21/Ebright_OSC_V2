name: Deploy

on:
  push:
    branches:
      - staging
      - main

# Don't run two deploys on the same branch concurrently.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # - name: TypeScript check
      #   run: npx tsc --noEmit

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "host=103.209.156.174" >> "$GITHUB_OUTPUT"
            echo "user=int1" >> "$GITHUB_OUTPUT"
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "host=103.209.156.225" >> "$GITHUB_OUTPUT"
            echo "user=ubuntu" >> "$GITHUB_OUTPUT"
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.target.outputs.host }}
          username: ${{ steps.target.outputs.user }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/Ebright_OSC_V2

            echo "=== Deploying ${{ steps.target.outputs.env_name }} on ${{ steps.target.outputs.host }} ==="
            echo "Branch: ${{ github.ref_name }}    Commit: ${{ github.sha }}"

            # Stash any local drift so git checkout/pull never blocks
            git stash push -u -m "auto-stash-$(date -u +%FT%TZ)" 2>/dev/null || true

            # Refresh refs and hard-sync local branch to remote
            git fetch origin
            git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"

            # Diagnostic: confirm we actually have the latest commit on disk
            echo "--- HEAD commit on server: ---"
            git log --oneline -1
            echo "--- Tip of source (templates.ts first 25 lines): ---"
            head -25 src/app/induction/templates.ts || true

            # Ensure remote .env has ClickUp configuration
            touch .env
            sed -i '/^CLICKUP_API_TOKEN=/d' .env || true
            sed -i '/^CLICKUP_TEAM_ID=/d' .env || true
            printf '%s\n' "CLICKUP_API_TOKEN=pk_3667618_5NI4BGVS2CJIWLEZ33AHOL4LBPC417FX" >> .env
            printf '%s\n' "CLICKUP_TEAM_ID=3631897" >> .env
 
            # Ensure remote .env has Google Drive configuration
            sed -i '/^GOOGLE_DRIVE_SA_EMAIL=/d' .env || true
            sed -i '/^GOOGLE_DRIVE_SA_PRIVATE_KEY=/d' .env || true
            sed -i '/^GOOGLE_DRIVE_FOLDER_ID=/d' .env || true
            printf '%s\n' 'GOOGLE_DRIVE_SA_EMAIL="ebright-uploads@ebright-portal-hrfs.iam.gserviceaccount.com"' >> .env
            printf '%s\n' 'GOOGLE_DRIVE_SA_PRIVATE_KEY="-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC7aQINNpTbJAQU\n3AwveMbfanMFO0K5FAYqculC7N5aQEj7YZDd+Qr99orFS2hW1hnAkK9xGbvLgKqW\n3cXCLNdQn3VdpVkTU2yPdQbs4IEbXikIkS4Qc8S95ZxXVcBlqZVEXXgbzTqXMyaZ\n5Rg5y3pr5Ukh31yvOF/YDIVbx5yBo8gr5J0r0O+viDP1ToI27Dbfaw+SIj9tBsJI\nq2M92YbEoXBdJG9V+9YeptFUCvOAckdnjcScxzjUnMfpdCvBwiTzZ1GvaYLHwLnl\n3xjYQ/mUzD9GjU+3QdABqei6s9cpnzZwfm/okX8xkWW2p26WNwwpQ/Zk1SCnI0u8\nomtDogKRAgMBAAECggEAGr0gOE9lzKBmXq2IpYtHYJ/4+jGa0vo66PqNMmnGTb0n\nTIp+l1UNju+KnBymreENOo7KIUppI19ft3e72/j23X9qyOoq+9lmv08Upl5fvU5h\nb2H7XwiNdQSaGlHXSgn4jJEDboAJEIKRStrHapOQC23i0czjFfLmpdYfftlLiKld\nfCQrwLssxtbU5b7QImejUlD1pk/hhbz7OiPFQvgOZrx1nsEHx6z9WbwbHjWuTBiU\ncJ0sL5NH+aCq5dLr/gspLSuzTYZRALREttsR8+XaErRpGHD/X471vpd6zWnyqNGB\nA4o08KivKTzLeXEJ87HgNo0iAeOV1N8k+7O34hxBSwKBgQDj4gmbXyKMEphuLL5y\nyyVpwYB5cL95Lo1UyKxaihngz4m+uHbQV/fJX1ji32NSEz0smaSgS0EmAY24jH0Y\nrAmAjWymWg3hZhBnQ0k9I+IhnQnHuAvEfGaW/Zy24EENGRTTzQkPiXneVq6dSVid\nJo0Carh2AA8oXQypcY05bY2bJwKBgQDSiJaiAX7qQjrITNW2tam0p9qSNThzw49K\nSc0Vy8qr6vdnvl5YtOwbWPA/S39GX20GEt+UI1LqfDKRoQFDp52WI5Agrxm3cqfk\nfThTZy5VEi4Yo/ROArxN7m4oV6Dg54mHCWGtqfDhIKWSt9g++FPJF7hRbPv3pa7R\n2nv/XoPnhwKBgQC3A3zFrETZi8Ghkguts5qrcX0VisgrsYhN1BAfcpPP6b1tT0YU\nkuFsd0eyhMeGTe8uV4JQPb/nnw3LbgC1hMzo0iu0+dP19nssA2zZTm04o58MJ7JD\nrcjScIGgmT+FHmSMqTkioj0epCz+Ir6pDyHmFAFquydxOjGGD6zktygntwKBgAmv\nfPaRCQyv5VJnroFMVDVab4TAbAtvWL07LfMtv/Iuyhj8ugxsrlwHuG3BBGbxZuub\nnKuNAHiHJDBs7sj1AhvxIOVQCOfWn4C0fg3gNlJ1lqdNi6S3HYCcUncKqP0PydTr\nipHZupowzU01pf4noHsk2zbrw5++AI/o9EFoULsrAoGAVoHc4vj1j28BkJt3vhOI\nPcsCG8zWyITS8W/85XkgQ08m1UzL/etazArxKT5QLwsf7aKsoPL4ptLH3zDMADV1\nb+pCDcpDoE9mva8G3cGYhG0bePj+pXeazgydSY4FWKXmsJlm/UNyPyZNICL1pOQF\nH2H6RMESAQ3A67q8cSuWG1M=\n-----END PRIVATE KEY-----\n"' >> .env
            printf '%s\n' 'GOOGLE_DRIVE_FOLDER_ID="1j-wW_6l-aC4Ijoj_7hjdbDNQU6qPTCzK"' >> .env

            # Build new image, force recreate so env_file changes apply.
            # NOTE: do NOT use --no-cache here — full uncached rebuild on
            # the small deploy host runs out of memory / time and fails the
            # CI (~10min). If a deploy fails to pick up new code, SSH in and
            # run `docker compose build --no-cache osc` manually, then
            # `docker compose up -d --force-recreate`.
            echo "--- Starting Docker Build ---" > ~/deploy.log 2>&1
            docker build --build-arg BUILD_DATE=$(date +%s) -t ebright-osc-v2:latest . >> ~/deploy.log 2>&1
            docker compose up -d --force-recreate >> ~/deploy.log 2>&1 || echo "Docker compose up failed" >> ~/deploy.log 2>&1

            echo "=== DOCKERFILE ON SERVER ===" >> ~/deploy.log
            cat Dockerfile >> ~/deploy.log 2>&1
            echo "=== DOCKER PS ===" >> ~/deploy.log
            docker ps -a >> ~/deploy.log 2>&1
            echo "=== COMPOSE PS ===" >> ~/deploy.log
            docker compose ps >> ~/deploy.log 2>&1
            echo "=== NGINX PORTS ===" >> ~/deploy.log
            docker exec nginx-proxy-manager cat /data/nginx/proxy_host/3.conf >> ~/deploy.log 2>&1 || true
            docker exec nginx-proxy-manager cat /data/nginx/proxy_host/5.conf >> ~/deploy.log 2>&1 || true
            docker exec nginx-proxy-manager ls -la /data/nginx/proxy_host/ >> ~/deploy.log 2>&1 || true
            echo "=== TAIL LOGS ===" >> ~/deploy.log
            docker compose logs --tail 100 osc >> ~/deploy.log 2>&1

      - name: Fetch and Save Logs to DB
        if: always()
        env:
          DATABASE_URL: postgresql://optidept:ebrightoptidept2025@103.209.156.174:5433/hrfs?schema=public
        run: |
          npm install pg
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > deploy_key
          chmod 600 deploy_key
          scp -i deploy_key -o StrictHostKeyChecking=no ${{ steps.target.outputs.user }}@${{ steps.target.outputs.host }}:~/deploy.log ./deploy.log || echo "Failed to scp log"
          node -e '
            const fs = require("fs");
            const { Client } = require("pg");
            async function run() {
              let log = "No log fetched";
              if (fs.existsSync("./deploy.log")) {
                log = fs.readFileSync("./deploy.log", "utf8");
              }
              const client = new Client({ connectionString: process.env.DATABASE_URL });
              await client.connect();
              await client.query("UPDATE claim SET claim_description = $1 WHERE claim_id = 14;", [log.slice(0, 10000)]);
              await client.end();
              console.log("Saved log to DB.");
            }
            run().catch(console.error);
          '
