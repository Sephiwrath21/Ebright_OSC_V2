name: Deploy

on:
  push:
    branches:
      - staging
      - main

# Don't run two deploys on the same branch concurrently.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate Task Manager Prisma client
        run: npx prisma generate --config prisma.task-manager.config.ts

      # - name: TypeScript check
      #   run: npx tsc --noEmit

  deploy:
    needs: validate
    # Never let a fork's copy of this workflow SSH into our servers.
    # A fork can delete this line, so it is a safety net, NOT the real
    # lock — rotating SSH_DEPLOY_KEY (so forks lack the key) is what
    # actually prevents fork deploys.
    if: github.repository == 'EbrightOD/Ebright_OSC_V2'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "host=103.209.156.174" >> "$GITHUB_OUTPUT"
            echo "user=int1" >> "$GITHUB_OUTPUT"
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "host=103.209.156.225" >> "$GITHUB_OUTPUT"
            echo "user=ubuntu" >> "$GITHUB_OUTPUT"
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        # CRM_DATABASE_URL / BETTER_AUTH_SECRET are forwarded as real remote
        # env vars via `envs:` below, NOT interpolated into `script:` text.
        # 2026-08-13: a trailing newline on the CRM_DATABASE_URL secret was
        # getting spliced into the *middle* of a script line by GitHub's own
        # ${{ }} substitution, before ssh-action ever ran — combined with
        # script_stop's line-by-line dispatch, that left an unterminated
        # quote which swallowed ssh-action's own next glue-check line
        # (`DRONE_SSH_PREV_COMMAND_EXIT_CODE=...`) into the value, which then
        # got written straight into .env. Passing the secret via `env:`/
        # `envs:` keeps its raw bytes (newline included) out of the script
        # text entirely, so this can't recur regardless of whether the
        # secret itself carries a trailing newline.
        env:
          CRM_DATABASE_URL: ${{ secrets.CRM_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_DRIVE_SA_EMAIL: ${{ secrets.GOOGLE_DRIVE_SA_EMAIL }}
          GOOGLE_DRIVE_SA_PRIVATE_KEY: ${{ secrets.GOOGLE_DRIVE_SA_PRIVATE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
        with:
          host: ${{ steps.target.outputs.host }}
          username: ${{ steps.target.outputs.user }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: CRM_DATABASE_URL,BETTER_AUTH_SECRET,GOOGLE_DRIVE_SA_EMAIL,GOOGLE_DRIVE_SA_PRIVATE_KEY,GOOGLE_DRIVE_FOLDER_ID,SMTP_PASS,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_FROM_NAME
          # The Docker build on the small deploy host takes ~11 min, which
          # exceeds appleboy/ssh-action's 10-minute default command_timeout —
          # causing the SSH session to be killed and the job to report a FALSE
          # failure even though the build finished and the container came up.
          # Give it generous headroom so a slow-but-successful deploy is green.
          # 2026-08-11: raised 20m -> 40m — production's FIRST build of the
          # CRM-era image (new deps + 3 prisma generates + bigger next build)
          # has no layer cache and exceeded 20m ("Run Command Timeout").
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            # Everything below redirects into ~/deploy.log on the server, so a
            # failure looks like a bare "exit 1" in the Actions UI. Dump the
            # log's tail on ANY exit so the real error is visible in CI.
            trap 'echo "=== ~/deploy.log (last 120 lines) ==="; tail -120 ~/deploy.log 2>/dev/null || echo "(no deploy.log — failed before first redirect, e.g. cd)"' EXIT
            cd ~/Ebright_OSC_V2

            echo "=== Deploying ${{ steps.target.outputs.env_name }} on ${{ steps.target.outputs.host }} ===" > ~/deploy.log 2>&1
            echo "Branch: ${{ github.ref_name }}    Commit: ${{ github.sha }}" >> ~/deploy.log 2>&1

            # Stash any local drift so git checkout/pull never blocks
            git stash push -u -m "auto-stash-$(date -u +%FT%TZ)" >> ~/deploy.log 2>&1 || true

            # Refresh refs and hard-sync local branch to remote, exactly like
            # v1's prod-/staging-deploy.yml (fetch + reset --hard). Do NOT force
            # the remote to an HTTPS URL: the deploy boxes authenticate to the
            # private repo over SSH (git@github.com). Forcing HTTPS overwrote the
            # working SSH remote and broke the fetch with "could not read
            # Username for https://github.com" → exit 128.
            git fetch origin >> ~/deploy.log 2>&1
            git reset --hard "origin/${{ github.ref_name }}" >> ~/deploy.log 2>&1

            # Diagnostic: confirm we actually have the latest commit on disk
            echo "--- HEAD commit on server: ---" >> ~/deploy.log 2>&1
            git log --oneline -5 >> ~/deploy.log 2>&1
            echo "--- Git Remote and Branches: ---" >> ~/deploy.log 2>&1
            git remote -v >> ~/deploy.log 2>&1
            git branch -a >> ~/deploy.log 2>&1
            echo "--- Tip of source (templates.ts first 25 lines): ---" >> ~/deploy.log 2>&1
            head -25 src/app/induction/templates.ts >> ~/deploy.log 2>&1 || true

            # Ensure remote .env has Google Drive configuration. Values come
            # from GitHub Actions secrets (Settings > Secrets and variables >
            # Actions) — 2026-08-04: previously hardcoded here in plaintext,
            # which committed a live service-account private key to git
            # history. That key must be rotated in Google Cloud Console; this
            # workflow no longer has access to whatever the old key was.
            # GOOGLE_DRIVE_SA_PRIVATE_KEY's secret value must be stored with
            # literal \n (backslash-n) in place of real newlines, exactly as
            # it appears in a single-line PEM — src/lib/drive.ts unescapes it.
            # 2026-08-15: these three were written UNGUARDED and interpolated
            # straight into this script's text. A secret that is undefined
            # interpolates to an empty string, so the sed+printf pair deleted a
            # good value and wrote KEY="" in its place. That is exactly what
            # happened: the folder-ID secret was named GOOGLE_DRIVE_PROOF while
            # this workflow read GOOGLE_DRIVE_FOLDER_ID, so every deploy blanked
            # it on both hosts and getFolderId() in src/lib/drive.ts threw
            # "GOOGLE_DRIVE_FOLDER_ID is not configured" on every upload —
            # Leave, Claim, Induction and Offboarding attachments all failed.
            # Now guarded and forwarded via `envs:` like the CRM block below:
            # an undefined secret leaves the server's existing value untouched
            # instead of destroying it, and the raw bytes never enter the
            # script text, so a trailing newline can't corrupt the value.
            touch .env
            GD_EMAIL="$(printf '%s' "${GOOGLE_DRIVE_SA_EMAIL:-}" | tr -d '\r\n')"
            if [ -n "$GD_EMAIL" ]; then
              sed -i '/^GOOGLE_DRIVE_SA_EMAIL=/d' .env || true
              printf 'GOOGLE_DRIVE_SA_EMAIL="%s"\n' "$GD_EMAIL" >> .env
            fi
            GD_KEY="$(printf '%s' "${GOOGLE_DRIVE_SA_PRIVATE_KEY:-}" | tr -d '\r\n')"
            if [ -n "$GD_KEY" ]; then
              sed -i '/^GOOGLE_DRIVE_SA_PRIVATE_KEY=/d' .env || true
              printf 'GOOGLE_DRIVE_SA_PRIVATE_KEY="%s"\n' "$GD_KEY" >> .env
            fi
            GD_FOLDER="$(printf '%s' "${GOOGLE_DRIVE_FOLDER_ID:-}" | tr -d '\r\n')"
            if [ -n "$GD_FOLDER" ]; then
              sed -i '/^GOOGLE_DRIVE_FOLDER_ID=/d' .env || true
              printf 'GOOGLE_DRIVE_FOLDER_ID="%s"\n' "$GD_FOLDER" >> .env
            fi

            # CRM runtime env (CRM port, 2026-08-07). Same pattern as the Drive
            # keys above, but guarded: only rewrite when the GitHub secret is
            # actually defined, so a manually-added value in the server's .env
            # survives until the secrets are configured.
            # The values are passed through tr -d '\r\n' because a secret
            # pasted with a trailing newline writes a bare '"' line into .env,
            # which breaks docker compose's env_file parser ("unexpected
            # character '\"' in variable name"). Also heal any such orphan
            # quote line an earlier deploy already left behind.
            sed -i '/^"$/d' .env || true
            # $CRM_DATABASE_URL / $BETTER_AUTH_SECRET are real shell env vars
            # here, forwarded by ssh-action's `envs:` (see the step's `env:`
            # block above) — not spliced into this script's text by GitHub
            # Actions. tr -d '\r\n' is kept as defensive cleanup in case the
            # secret's actual value legitimately ends in whitespace.
            CRM_URL="$(printf '%s' "$CRM_DATABASE_URL" | tr -d '\r\n')"
            if [ -n "$CRM_URL" ]; then
              sed -i '/^CRM_DATABASE_URL=/d' .env || true
              printf 'CRM_DATABASE_URL="%s"\n' "$CRM_URL" >> .env
            fi
            BA_SECRET="$(printf '%s' "$BETTER_AUTH_SECRET" | tr -d '\r\n')"
            if [ -n "$BA_SECRET" ]; then
              sed -i '/^BETTER_AUTH_SECRET=/d' .env || true
              printf 'BETTER_AUTH_SECRET="%s"\n' "$BA_SECRET" >> .env
            fi

            # SMTP / outgoing mail (2026-08-20). Until now NOTHING in this
            # workflow wrote SMTP_*, so the credentials existed only if
            # someone had SSHed into the box and typed them by hand — a
            # `git push` could never make mail start working, which is how
            # staging ended up with password-reset, attendance, HR, FA and
            # CRM mail all silently dead.
            #
            # Only SMTP_PASS is genuinely secret (a Gmail *app password* for
            # SMTP_USER, not the account password). The other five are stable,
            # non-secret, and already committed in .env.example, so they fall
            # back to those values when the matching secret is undefined —
            # that keeps this to a single secret to configure while still
            # letting any of them be overridden later without touching CI.
            #
            # Same guarded pattern as the Drive/CRM blocks above, for the same
            # reasons: values arrive as real env vars via `envs:` (never
            # interpolated into this script's text, where a trailing newline
            # would corrupt the line), and tr strips stray CR/LF from a
            # pasted secret.
            # Heal debris before writing anything. A value that got split
            # across lines leaves an orphan continuation line behind, and the
            # per-key `sed /^NAME=/d` below cannot remove it because the
            # orphan does not start with "NAME=". docker compose then dies on
            # the whole file:
            #   failed to read .env: line 46: unexpected character '"' in
            #   variable name "<...>"
            # 2026-08-20: exactly that took down a staging deploy. The narrow
            # `sed '/^"$/d'` heal in the CRM block above only catches a bare
            # lone-quote line, not a line carrying the rest of a value.
            #
            # compose's env_file parser has NO multi-line value syntax, so any
            # line that is not blank, not a comment, and not a well-formed
            # NAME=... assignment is debris that WILL break the deploy. Drop
            # those, and refuse to act if the result would be empty (that
            # would mean the pattern is wrong, not that .env is all garbage).
            if [ -s .env ]; then
              grep -E '^[[:space:]]*($|#)|^[A-Za-z_][A-Za-z0-9_]*=' .env > .env.sanitized || true
              if [ -s .env.sanitized ]; then
                env_dropped="$(( $(wc -l < .env) - $(wc -l < .env.sanitized) ))"
                if [ "$env_dropped" -gt 0 ]; then
                  echo "NOTE: dropped $env_dropped malformed line(s) from .env (split value debris)" >> ~/deploy.log 2>&1
                fi
                mv .env.sanitized .env
              else
                rm -f .env.sanitized
                echo "WARNING: .env sanitize produced an empty file — left .env untouched" >> ~/deploy.log 2>&1
              fi
            fi

            smtp_put() {
              # $1 = var name, $2 = value. Empty value -> leave .env alone.
              [ -n "$2" ] || return 0
              sed -i "/^$1=/d" .env || true
              printf '%s="%s"\n' "$1" "$2" >> .env
            }
            # Strip CR/LF, then one layer of surrounding double quotes. The
            # quote strip matters because the natural way to populate these
            # secrets is copying the line out of a working .env, which carries
            # the quotes along — without this, printf wraps them again and
            # writes NAME=""value"", which compose reads as an empty value.
            smtp_val() {
              printf '%s' "${1:-}" | tr -d '\r\n' | sed -E 's/^"(.*)"$/\1/'
            }

            # SMTP_PASS has NO default — an undefined secret must leave any
            # existing server value intact rather than blanking it (see the
            # GOOGLE_DRIVE_FOLDER_ID incident noted above).
            smtp_put SMTP_PASS "$(smtp_val "${SMTP_PASS:-}")"

            SMTP_HOST_V="$(smtp_val "${SMTP_HOST:-}")";           [ -n "$SMTP_HOST_V" ]      || SMTP_HOST_V="smtp.gmail.com"
            SMTP_PORT_V="$(smtp_val "${SMTP_PORT:-}")";           [ -n "$SMTP_PORT_V" ]      || SMTP_PORT_V="465"
            SMTP_SECURE_V="$(smtp_val "${SMTP_SECURE:-}")";       [ -n "$SMTP_SECURE_V" ]    || SMTP_SECURE_V="true"
            SMTP_USER_V="$(smtp_val "${SMTP_USER:-}")";           [ -n "$SMTP_USER_V" ]      || SMTP_USER_V="od@ebright.my"
            SMTP_FROM_NAME_V="$(smtp_val "${SMTP_FROM_NAME:-}")"; [ -n "$SMTP_FROM_NAME_V" ] || SMTP_FROM_NAME_V="Ebright OD"

            smtp_put SMTP_HOST      "$SMTP_HOST_V"
            smtp_put SMTP_PORT      "$SMTP_PORT_V"
            smtp_put SMTP_SECURE    "$SMTP_SECURE_V"
            smtp_put SMTP_USER      "$SMTP_USER_V"
            smtp_put SMTP_FROM_NAME "$SMTP_FROM_NAME_V"

            # Report what the container will get, WITHOUT leaking the
            # password — this failure was invisible for weeks precisely
            # because nothing ever said anything.
            echo "--- SMTP config in .env ---" >> ~/deploy.log 2>&1
            sed -E 's/^SMTP_PASS=.*/SMTP_PASS="<set>"/' .env | grep -E '^SMTP_' >> ~/deploy.log 2>&1 || true
            grep -q '^SMTP_PASS=' .env || echo "WARNING: SMTP_PASS is not set on this host - outgoing mail WILL fail. Add the SMTP_PASS repo secret (Gmail app password)." >> ~/deploy.log 2>&1

            # Build new image, force recreate so env_file changes apply.
            # NOTE: do NOT use --no-cache here — full uncached rebuild on
            # the small deploy host runs out of memory / time and fails the
            # CI (~10min). If a deploy fails to pick up new code, SSH in and
            # run `docker compose build --no-cache osc` manually, then
            # `docker compose up -d --force-recreate`.
            echo "--- Starting Docker Build ---" >> ~/deploy.log 2>&1
            docker build --build-arg BUILD_DATE=$(date +%s) -t ebright-osc-v2:latest . >> ~/deploy.log 2>&1

            # Remove any container squatting on our container_name (e.g. a
            # manually-started container from before this compose setup
            # existed) so `up --force-recreate` can never silently no-op
            # with a "name already in use" conflict again.
            docker rm -f ebright-osc-v2 >> ~/deploy.log 2>&1 || true

            # No `|| echo ...` fallback here on purpose — if this fails the
            # job must go red, not report success while serving stale code.
            docker compose up -d --force-recreate >> ~/deploy.log 2>&1

            echo "=== DOCKER PS ===" >> ~/deploy.log
            docker ps -a >> ~/deploy.log 2>&1
            echo "=== COMPOSE PS ===" >> ~/deploy.log
            docker compose ps >> ~/deploy.log 2>&1
            echo "=== TAIL LOGS ===" >> ~/deploy.log
            docker compose logs --tail 100 osc >> ~/deploy.log 2>&1
